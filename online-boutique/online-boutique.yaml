apiVersion: v1
kind: Namespace
metadata:
  name: online-boutique
---
# AdService
apiVersion: v1
kind: Service
metadata:
  name: adservice
  namespace: online-boutique
spec:
  ports:
    - port: 9555
      targetPort: 9555
  selector:
    app: adservice
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: online-boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
      annotations:
        instrumentation.opentelemetry.io/inject-java: "platform/signoz-instrumentation"
    spec:
      containers:
        - name: adservice
          image: gcr.io/google-samples/microservices-demo/adservice:v0.10.0
          ports:
            - containerPort: 9555
          env:
            - name: AD_SERVICE_PORT
              value: "9555"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
# CartService
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  namespace: online-boutique
spec:
  ports:
