metadata:
  name: cartservice
  namespace: online-boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
      annotations:
        instrumentation.opentelemetry.io/inject-dotnet: "platform/signoz-instrumentation"
    spec:
      containers:
        - name: cartservice
          image: gcr.io/google-samples/microservices-demo/cartservice:v0.10.0
          ports:
            - containerPort: 7070
          env:
            - name: CART_SERVICE_PORT
              value: "7070"
            - name: REDIS_ADDR
              value: "redis-cart:6379"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
